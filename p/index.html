<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Outside plan invite</title>
<style>
:root{--bg:#f7f6f2;--fg:#1d1d1b;--muted:#6b6a65;--accent:#2f6f4f;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#f1efe8;--muted:#a3a19a;--accent:#7cc49c;--card:#1f1f1d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
main{background:var(--card);border-radius:16px;padding:28px 24px;max-width:420px;width:100%;text-align:center}
h1{font-size:24px;margin:0 0 8px}p{color:var(--muted);margin:0 0 20px}
a.btn{display:block;background:var(--accent);color:#fff;text-decoration:none;border-radius:12px;padding:14px;font-weight:600}
@media (prefers-color-scheme:dark){a.btn{color:#10201a}}
small{display:block;margin-top:16px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>You have a plan invite</h1>
<p>Open this link on your phone with the Outside app installed.</p>
<a class="btn" id="open" href="#">Open in Outside</a>
<small id="note">If nothing happens, install Outside, then tap the link again.</small>
</main>
<script>
(function(){
  // The token is in the fragment, so it never reaches this server. Nothing is stored or sent.
  var t = location.hash.slice(1);
  var a = document.getElementById('open');
  if (!/^[A-Za-z0-9_-]{16,128}$/.test(t)) { a.style.display='none'; document.getElementById('note').textContent='This link is not complete. Ask for a new one.'; return; }
  a.href = 'outside://invite/plan/' + t;
})();
</script>
</body>
</html>
